<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issuebridge</title>
    <script type="module" src="/src/main.tsx"></script>
  </head>

  <body>
    <div id="root"></div>

    <template id="legacy-workspace-template">
      <div class="legacy-workspace">
        <!-- Conflict modal kept for slice 5; Update conflicts use React ConflictDialog. -->
        <div
          id="conflict-modal"
          class="conflict-modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="conflict-title"
          hidden
        >
          <div class="conflict-panel">
            <h2 id="conflict-title" class="conflict-title">Conflict</h2>
            <p id="conflict-copy" class="conflict-copy">
              This issue changed on GitHub since you last updated it. Keep your
              local edits, or use the GitHub version.
            </p>
            <div class="conflict-actions">
              <button type="button" id="conflict-keep-mine" class="btn primary">
                Keep mine
              </button>
              <button
                type="button"
                id="conflict-use-theirs"
                class="btn primary"
              >
                Use theirs
              </button>
            </div>
            <p class="conflict-secondary">
              <a
                id="conflict-view-github"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                >View on GitHub</a
              >
            </p>
          </div>
        </div>
      </div>
    </template>
  </body>
</html>
