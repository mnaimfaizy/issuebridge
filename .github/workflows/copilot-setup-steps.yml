# Pre-install tools/deps for Copilot cloud agent + code review environments.
# Must land on the default branch before Copilot picks it up.
# Job name MUST be `copilot-setup-steps`.
# Mirrors CI toolchain (Ubuntu PR gate) so the agent can lint/typecheck/test.
# Docs: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment

name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Whisper sidecar/resources are Windows-only and fetched outside git.
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Build artifacts must exist before the agent starts. Without them rust-analyzer
      # cannot expand macros and emits a warning per call site, which floods the agent's
      # stdout until its Node process aborts (EAGAIN, exit 134).
      - name: Warm Rust build cache
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
