# TEMPORARY probe for #199 — removed before this PR merges.
#
# Can a workflow approve, with the job token, the pull_request run that GitHub
# holds back after a job-token push?
name: Responder probe (temporary)

on:
  push:
    branches: [chore/review-responder]
    paths: [.github/workflows/responder-probe.yml]

permissions: {}

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      HELD_RUN: "37572227645"
    steps:
      - name: Try to approve the held run with the job token
        run: |
          set -uo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HELD_RUN" --jq '"before: status=\(.status) conclusion=\(.conclusion)"'
          if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$HELD_RUN/approve"; then
            echo "RESULT: approve accepted for the job token"
          else
            echo "RESULT: approve refused for the job token"
          fi
          sleep 10
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HELD_RUN" --jq '"after: status=\(.status) conclusion=\(.conclusion)"'
