# TEMPORARY probe for #199 — removed before this PR merges.
#
# Runs the agent step the way the token-free responder will: a read-only job
# token, no OIDC, dependencies installed with scripts off. Two variants, with
# and without CLAUDE_CODE_SUBPROCESS_ENV_SCRUB, to see which credentials a
# subprocess can name and whether builds and local commits still work.
name: Responder probe (temporary)

on:
  push:
    branches: [chore/review-responder]
    paths: [.github/workflows/responder-probe.yml]

permissions: {}

jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        scrub: ["1", ""]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ matrix.scrub }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Is bubblewrap present
        run: command -v bwrap || echo "bwrap not installed"
      - name: Run probe agent (Claude Code)
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            This is a short infrastructure probe. Run each numbered command exactly once, in order,
            with the Bash tool, and do nothing else. If a command fails or is denied, record that
            and continue with the next one. Never print the value of any environment variable.

            1. npm exec -c 'node -e "console.log(\"VISIBLE:\" + Object.keys(process.env).filter(k => /TOKEN|OAUTH|ALL_INPUTS|ACTIONS_/.test(k)).sort().join(\",\"))"'
            2. npm run typecheck
            3. npm run test:ci-contract
            4. cargo fetch --manifest-path src-tauri/Cargo.toml
            5. cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --offline --no-deps

            Then use the Write tool to create probe-note.txt in the repository root containing the
            single word probe, and run:

            6. git add probe-note.txt
            7. git commit -m "chore: probe commit"
            8. git log --oneline -1

            Finally use the Write tool to create probe-result.md in the repository root with one line
            per numbered command: the number, then OK, FAILED or DENIED, then at most one line of
            its output. For command 1 copy the VISIBLE line in full.
          claude_args: |
            --model claude-haiku-4-5-20251001
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Edit,Write,MultiEdit,Bash(npm:*),Bash(cargo:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*)"
            --disallowedTools "Read(./.git/**)"
      - name: Report
        if: always()
        run: |
          echo "RESULT scrub='${CLAUDE_CODE_SUBPROCESS_ENV_SCRUB}'"
          cat probe-result.md 2>/dev/null || echo "RESULT: no probe-result.md"
          echo "RESULT git: $(git log --oneline -1) | author: $(git log -1 --format='%an <%ae>')"
          # Names only: does the origin URL carry a credential?
          git remote get-url origin | sed -E 's#//[^@/]+@#//<credential>@#'
