# PROTOTYPE — agent pipeline orchestrator (Issuebridge pilot)
# Spec: docs/agent-pipeline-pilot.md (map #80 / prototype #88)
# Throwaway-quality vertical slice: gates + Copilot CLI plan + Copilot cloud-agent implement.

name: Agent pipeline

on:
  issues:
    types: [labeled]

concurrency:
  group: agent-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  # Prefer GITHUB_TOKEN Copilot CLI auth when the account/repo supports it:
  # https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli-in-actions
  copilot-requests: write

jobs:
  gate:
    if: >-
      github.event.label.name == 'agent:plan' ||
      github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      label: ${{ steps.check.outputs.label }}
      issue: ${{ steps.check.outputs.issue }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.AGENT_PIPELINE_ENABLED }}
          ALLOWLIST: ${{ vars.AGENT_PIPELINE_ALLOWLIST }}
          ACTOR: ${{ github.actor }}
          LABEL: ${{ github.event.label.name }}
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

          if [ "${ENABLED:-}" != "true" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "Agent pipeline kill-switch is on (\`AGENT_PIPELINE_ENABLED!=true\`). No-op."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=',' read -r -a allowed <<< "${ALLOWLIST:-}"
          ok=false
          for u in "${allowed[@]}"; do
            u_trim="$(echo "$u" | xargs)"
            if [ -n "$u_trim" ] && [ "$u_trim" = "$ACTOR" ]; then
              ok=true
              break
            fi
          done

          if [ "$ok" != "true" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "Agent pipeline ignored label \`$LABEL\`: \`$ACTOR\` is not on \`AGENT_PIPELINE_ALLOWLIST\`."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Consume trigger label so it cannot re-fire without re-adding.
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" || true
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  plan:
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.label == 'agent:plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run planner (Copilot CLI)
        id: plan
        env:
          # Prefer fine-grained PAT (Copilot Requests). Falls back to GITHUB_TOKEN.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ needs.gate.outputs.issue }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            export COPILOT_GITHUB_TOKEN="$GH_TOKEN"
          fi
          TITLE=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          BODY=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          PROMPT_FILE=".github/agent-pipeline/planner-prompt.md"
          {
            echo "Issue #$ISSUE — $TITLE"
            echo
            echo "$BODY"
            echo
            echo "-----"
            echo
            cat "$PROMPT_FILE"
          } > /tmp/planner-user.txt

          # Minimal tools: read repo via shell listing/cat only; write plan to runner file.
          set +e
          copilot -p "$(cat /tmp/planner-user.txt)" \
            -s \
            --allow-tool='shell(ls:*),shell(find:*),shell(cat:*),shell(head:*),shell(rg:*),shell(git:*)' \
            --allow-tool=write \
            --no-ask-user \
            > /tmp/plan-raw.md 2>/tmp/plan-err.txt
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$(printf 'Planner failed (Copilot CLI exit %s).\n\n```\n%s\n```' "$status" "$(tail -c 4000 /tmp/plan-err.txt)")"
            exit 1
          fi

          {
            echo "<!-- agent-pipeline-plan -->"
            echo
            if ! grep -q '^## Agent plan' /tmp/plan-raw.md; then
              echo "## Agent plan"
              echo
            fi
            cat /tmp/plan-raw.md
          } > /tmp/plan-comment.md

          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/plan-comment.md

  implement:
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.label == 'agent:implement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate plan + assign Copilot cloud agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Always use Actions GITHUB_TOKEN for issue comments / reads (fine-grained PATs
          # often lack Issues: write → GraphQL addComment fails).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          COMMENTS=$(gh api "repos/$OWNER/$REPO/issues/$ISSUE/comments" --paginate)
          PLAN=$(echo "$COMMENTS" | jq -r '
            [ .[] | select(.body | contains("<!-- agent-pipeline-plan -->")) ] |
            last | .body // empty
          ')
          if [ -z "$PLAN" ]; then
            gh issue comment "$ISSUE" --repo "$OWNER/$REPO" \
              --body "Implementer aborted: no \`<!-- agent-pipeline-plan -->\` comment found. Add \`agent:plan\` first."
            exit 1
          fi

          PREFIX=$(cat .github/agent-pipeline/implementer-instructions.md)
          jq -n \
            --arg plan "$PLAN" \
            --arg prefix "$PREFIX" \
            --arg repo "$OWNER/$REPO" \
            --arg base "${{ github.event.repository.default_branch }}" \
            '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repo,
                base_branch: $base,
                custom_instructions: ($prefix + "\n\n---\n\n" + $plan),
                custom_agent: "",
                model: ""
              }
            }' > /tmp/assign.json

          # Assign with Copilot PAT only for this call (user-to-server).
          ASSIGN_TOKEN="${COPILOT_GITHUB_TOKEN:-$GH_TOKEN}"
          set +e
          GH_TOKEN="$ASSIGN_TOKEN" gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$OWNER/$REPO/issues/$ISSUE/assignees" \
            --input /tmp/assign.json > /tmp/assign-out.json 2>/tmp/assign-err.txt
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            gh issue comment "$ISSUE" --repo "$OWNER/$REPO" --body "$(printf 'Implementer assign failed.\n\n```\n%s\n```\n\nEnsure \`COPILOT_GITHUB_TOKEN\` can assign Copilot cloud agent (fine-grained PAT: Copilot Requests + Issues/Contents/PRs write on this repo).' "$(tail -c 4000 /tmp/assign-err.txt)")"
            exit 1
          fi

          gh issue comment "$ISSUE" --repo "$OWNER/$REPO" \
            --body "Implementer started: assigned \`copilot-swe-agent[bot]\` with plan handoff. After the PR exists, request Copilot review and keep ≤2 auto fix rounds (orchestrator policy — manual for this prototype slice if needed)."
