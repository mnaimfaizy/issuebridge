# PROTOTYPE — agent pipeline review loop (Issuebridge pilot)
# Spec: docs/agent-pipeline-pilot.md §4.4
# Flow: request Copilot review → on CI fail / review findings @copilot fix (≤2) → assign maintainer
#
# Important:
# - @copilot mentions must be posted with COPILOT_GITHUB_TOKEN (user PAT). Comments from
#   github-actions[bot] are ignored by Copilot cloud agent (no 👀 reaction).
# - Do not fire a fix round in the same run as the first review request; wait for the
#   reviewer (or a later CI signal) so Implementer follows Reviewer.
# - On synchronize after a Copilot push, wait for CI in-job (workflow_run from Copilot
#   often lands in action_required and never runs round-2 / handoff).
# - Review findings = unresolved + non-outdated Copilot threads only.
# - A Copilot session that ends in error (e.g. stdout EAGAIN → exit 134) gets a free
#   retry: it did not complete its round, so it must not consume the 2-round budget.

name: Agent pipeline review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]
  # Copilot code review runs as a dynamic Actions workflow; its completion is a reliable
  # signal that findings may be ready (pull_request_review from the bot is flaky/absent).
  workflow_run:
    workflows: ["CI", "Running Copilot Code Review"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate (backfill / stuck PRs)"
        required: true
        type: string

concurrency:
  group: agent-pipeline-review-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  review-loop:
    if: vars.AGENT_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR + decide action
        id: decide
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOWLIST: ${{ vars.AGENT_PIPELINE_ALLOWLIST }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_INPUT: ${{ inputs.pr_number }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_PRS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
          REVIEW_LOGIN: ${{ github.event.review.user.login }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # grep -c prints 0 but exits 1 on no match; never pair with `|| echo 0`.
          count_matches() {
            local n
            n=$(grep -c -- "$1" <<<"$2" || true)
            printf '%s' "${n:-0}"
          }
          as_int() {
            local v
            v=$(printf '%s' "${1:-0}" | tr -d '[:space:]')
            [[ "$v" =~ ^[0-9]+$ ]] || v=0
            printf '%s' "$v"
          }
          is_copilot_login() {
            local login="${1,,}"
            [[ "$login" == "copilot[bot]" ]] ||
              [[ "$login" == "copilot-pull-request-reviewer[bot]" ]] ||
              [[ "$login" == "copilot-swe-agent[bot]" ]]
          }
          is_allowlisted_login() {
            local candidate="${1,,}"
            local entry
            local -a entries
            IFS=',' read -ra entries <<<"${ALLOWLIST:-}"
            for entry in "${entries[@]}"; do
              entry=$(echo "$entry" | xargs)
              if [[ "${entry,,}" == "$candidate" ]]; then
                return 0
              fi
            done
            return 1
          }
          is_authorized_login() {
            local login="${1,,}"
            [[ "$login" == "github-actions[bot]" ]] || is_copilot_login "$login" || is_allowlisted_login "$login"
          }

          PR=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="$PR_FROM_INPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            PR=$(jq -r '.[0].number // empty' <<<"${WR_PRS_JSON:-[]}")
            if [ -z "$PR" ] && [ -n "${WR_HEAD_SHA:-}" ]; then
              PR=$(gh api "repos/$OWNER/$REPO/commits/$WR_HEAD_SHA/pulls" \
                -H "Accept: application/vnd.github.groot-preview+json" \
                --jq '.[0].number // empty' || true)
            fi
          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            # Non-authorized reviews still resolve the PR, then no-op after authorization.
            if [ -n "${REVIEW_LOGIN:-}" ] && ! is_authorized_login "$REVIEW_LOGIN"; then
              # Still allow non-Copilot reviews to no-op after resolve; don't exit before PR set
              :
            fi
            PR="$PR_FROM_EVENT"
          else
            PR="$PR_FROM_EVENT"
          fi

          if [ -z "$PR" ]; then
            echo "No PR resolved; skipping."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

          META=$(gh pr view "$PR" --repo "$OWNER/$REPO" --json number,author,headRefName,headRefOid,isDraft,state,body,reviews,comments,closingIssuesReferences,reviewRequests,assignees)
          STATE=$(jq -r '.state' <<<"$META")
          if [ "$STATE" != "OPEN" ]; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AUTHOR=$(jq -r '.author.login' <<<"$META")
          HEAD_REF=$(jq -r '.headRefName' <<<"$META")
          HEAD_SHA=$(jq -r '.headRefOid' <<<"$META")
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # Authorize actor and PR author before branch names or markers can classify the PR.
          if ! is_authorized_login "$ACTOR" || ! is_authorized_login "$AUTHOR"; then
            echo "Review automation is not authorized for this actor or PR author."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PIPELINE=false
          if is_copilot_login "$AUTHOR"; then PIPELINE=true; fi
          if echo "$HEAD_REF" | grep -q '^copilot/'; then PIPELINE=true; fi

          HAS_PLAN=false
          ISSUE_NUMS=$(jq -r '.closingIssuesReferences[]?.number // empty' <<<"$META")
          BODY_ISSUES=$(jq -r '.body // ""' <<<"$META" | grep -oE '#[0-9]+' | tr -d '#' || true)
          ALL_ISSUES=$(printf '%s\n%s\n' "$ISSUE_NUMS" "$BODY_ISSUES" | awk 'NF' | sort -u)
          for ISS in $ALL_ISSUES; do
            COMMENTS=$(gh api "repos/$OWNER/$REPO/issues/$ISS/comments" --paginate)
            if jq -e '[.[] | select(.body | contains("<!-- agent-pipeline-plan -->"))] | length > 0' <<<"$COMMENTS" >/dev/null; then
              HAS_PLAN=true
              break
            fi
          done

          COMMENT_BODIES=$(jq -r '.comments[]?.body // empty' <<<"$META")
          if echo "$COMMENT_BODIES" | grep -q '<!-- agent-pipeline-'; then
            HAS_PLAN=true
          fi

          if [ "$PIPELINE" != "true" ] || [ "$HAS_PLAN" != "true" ]; then
            echo "Not an agent-pipeline PR (author=$AUTHOR ref=$HEAD_REF plan=$HAS_PLAN)."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$COMMENT_BODIES" | grep -q '<!-- agent-pipeline-handoff -->'; then
            echo "Already handed off."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only PAT-posted rounds (invoked:user) count toward the budget. Legacy
          # github-actions @copilot comments are ignored by Copilot and must not burn rounds.
          USER_FIX_ROUNDS=$(as_int "$(count_matches 'invoked:user' "$COMMENT_BODIES")")
          # A crashed Copilot session did not complete its round, so its retry is free.
          CRASH_RETRIES=$(as_int "$(count_matches 'kind:crash-retry' "$COMMENT_BODIES")")
          MAX_CRASH_RETRIES=2
          if [ "$USER_FIX_ROUNDS" -gt "$CRASH_RETRIES" ]; then
            FIX_ROUNDS=$((USER_FIX_ROUNDS - CRASH_RETRIES))
          else
            FIX_ROUNDS=0
          fi
          echo "fix_rounds=$FIX_ROUNDS" >> "$GITHUB_OUTPUT"
          echo "crash_retries=$CRASH_RETRIES" >> "$GITHUB_OUTPUT"

          MAINTAINER=$(echo "${ALLOWLIST:-}" | awk -F',' '{print $1}' | xargs)
          echo "maintainer=$MAINTAINER" >> "$GITHUB_OUTPUT"

          refresh_ci() {
            CI_STATE=$(gh api "repos/$OWNER/$REPO/commits/$HEAD_SHA/status" --jq '.state // empty' || true)
            CHECKS=$(gh api "repos/$OWNER/$REPO/commits/$HEAD_SHA/check-runs" --paginate \
              --jq '[.check_runs[] | select(.name=="frontend" or .name=="rust" or .name=="ci") | {name, conclusion, status}]' || echo '[]')
            FRONTEND=$(jq -r '[.[] | select(.name=="frontend") | .conclusion] | last // empty' <<<"$CHECKS")
            RUST=$(jq -r '[.[] | select(.name=="rust") | .conclusion] | last // empty' <<<"$CHECKS")
            CI_JOB=$(jq -r '[.[] | select(.name=="ci") | .conclusion] | last // empty' <<<"$CHECKS")
            CHECKS_PENDING=$(as_int "$(jq '[.[] | select(.status != "completed")] | length' <<<"$CHECKS")")
            CI_FAILED=false
            CI_GREEN=false
            if [ "$FRONTEND" = "failure" ] || [ "$RUST" = "failure" ] || [ "$CI_JOB" = "failure" ] || [ "$CI_STATE" = "failure" ]; then
              CI_FAILED=true
            fi
            if [ "$CHECKS_PENDING" -eq 0 ] && { [ "$CI_JOB" = "success" ] || { [ "$FRONTEND" = "success" ] && [ "$RUST" = "success" ]; }; }; then
              CI_GREEN=true
            fi
          }

          refresh_ci
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "${WR_NAME:-}" = "CI" ] && [ "${WR_CONCLUSION:-}" = "failure" ]; then
            CI_FAILED=true
            CI_GREEN=false
          fi
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "${WR_NAME:-}" = "CI" ] && [ "${WR_CONCLUSION:-}" = "success" ]; then
            CI_GREEN=true
            CI_FAILED=false
          fi

          # Copilot review findings — only unresolved + non-outdated threads (inline alone is noisy).
          REVIEW_FINDINGS=false
          COPILOT_REVIEW_COUNT=$(as_int "$(jq '
            [.reviews[]?
              | select((.author.login | ascii_downcase) as $login
                | ["copilot[bot]", "copilot-pull-request-reviewer[bot]", "copilot-swe-agent[bot]"]
                | index($login))
            ] | length
          ' <<<"$META")")

          THREADS_JSON=$(gh api graphql -f query="
            query(\$o:String!,\$n:String!,\$p:Int!) {
              repository(owner:\$o,name:\$n) {
                pullRequest(number:\$p) {
                  reviewThreads(first:100) {
                    nodes {
                      isResolved
                      isOutdated
                      path
                      comments(first:1) { nodes { author { login } body } }
                    }
                  }
                }
              }
            }" -f o="$OWNER" -f n="$REPO" -F p="$PR" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved==false and .isOutdated==false)
              | select((.comments.nodes[0].author.login | ascii_downcase) as $login
                | ["copilot[bot]", "copilot-pull-request-reviewer[bot]", "copilot-swe-agent[bot]"]
                | index($login))
              | {path, body: .comments.nodes[0].body}]' || echo '[]')

          UNRESOLVED=$(as_int "$(jq 'length' <<<"$THREADS_JSON")")
          FINDINGS_SUMMARY=$(jq -r '
            if length == 0 then empty
            else
              ["Open Copilot review threads:"] +
              [.[] | "- `\(.path)`: \((.body // "") | split("\n")[0] | .[0:180])"]
              | join("\n")
            end
          ' <<<"$THREADS_JSON")

          if [ "$UNRESOLVED" -gt 0 ]; then
            REVIEW_FINDINGS=true
          fi
          # Fresh Copilot review event with no threads yet: keep findings false (nothing to fix).
          if [ "$EVENT_NAME" = "workflow_run" ] && echo "${WR_NAME:-}" | grep -qi 'copilot code review'; then
            if [ "$UNRESOLVED" -gt 0 ]; then
              REVIEW_FINDINGS=true
            fi
          fi
          if [ "$EVENT_NAME" = "pull_request_review" ] && is_copilot_login "${REVIEW_LOGIN:-}"; then
            if [ "$UNRESOLVED" -gt 0 ]; then
              REVIEW_FINDINGS=true
            fi
          fi

          REVIEW_REQUESTED=$(as_int "$(count_matches '<!-- agent-pipeline-review-requested -->' "$COMMENT_BODIES")")
          HAS_REVIEW_REQ=$(as_int "$(jq '[.reviewRequests[]?.login // empty
            | ascii_downcase
            | select(. == "copilot[bot]" or . == "copilot-pull-request-reviewer[bot]" or . == "copilot-swe-agent[bot]")
          ] | length' <<<"$META")")

          ALREADY_FIX_THIS_SHA=false
          if echo "$COMMENT_BODIES" | grep -q "<!-- agent-pipeline-fix-round:.*sha:${HEAD_SHA}.*invoked:user"; then
            ALREADY_FIX_THIS_SHA=true
          fi

          # Copilot cloud agent sessions can abort mid-task (stdout EAGAIN → exit 134) after
          # pushing a partial change. Detect that so the round is retried, not blamed.
          AGENT_CRASHED=false
          AGENT_RUN_ID=""
          AGENT_RUN_URL=""
          RUNS_JSON=$(gh api "repos/$OWNER/$REPO/actions/runs?per_page=100" || echo '{"workflow_runs":[]}')
          LATEST_AGENT=$(jq --arg ref "$HEAD_REF" --arg pr "$PR" '
            [ .workflow_runs[]?
              | select((.name // "") | test("copilot cloud agent"; "i"))
              | select(((.head_branch // "") == $ref) or ((.display_title // "") | test("PR #" + $pr + "([^0-9]|$)")))
              | {id, conclusion, status, created_at, html_url}
            ] | sort_by(.created_at) | last // empty' <<<"$RUNS_JSON")

          if [ -n "$LATEST_AGENT" ]; then
            AGENT_RUN_ID=$(jq -r '.id' <<<"$LATEST_AGENT")
            AGENT_RUN_URL=$(jq -r '.html_url' <<<"$LATEST_AGENT")
            AGENT_CONCLUSION=$(jq -r '.conclusion // empty' <<<"$LATEST_AGENT")
            if [ "$AGENT_CONCLUSION" = "failure" ] && ! echo "$COMMENT_BODIES" | grep -q "crash-run:${AGENT_RUN_ID}"; then
              AGENT_CRASHED=true
            fi
          fi
          echo "agent_crashed=$AGENT_CRASHED" >> "$GITHUB_OUTPUT"
          echo "agent_run_id=$AGENT_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "agent_run_url=$AGENT_RUN_URL" >> "$GITHUB_OUTPUT"

          NEED_FIRST_REVIEW=false
          if [ "$REVIEW_REQUESTED" -eq 0 ] && [ "$HAS_REVIEW_REQ" -eq 0 ] && [ "$COPILOT_REVIEW_COUNT" -eq 0 ]; then
            NEED_FIRST_REVIEW=true
          fi

          # Copilot pushes often leave CI pending; workflow_run from Copilot can sit in
          # action_required. Wait here on synchronize so round-2 / handoff still runs.
          if [ "$NEED_FIRST_REVIEW" != "true" ] && [ "$ALREADY_FIX_THIS_SHA" != "true" ]; then
            if [ "$CHECKS_PENDING" -gt 0 ] || { [ "$CI_GREEN" != "true" ] && [ "$CI_FAILED" != "true" ]; }; then
              echo "Waiting for CI checks on $HEAD_SHA (pending=$CHECKS_PENDING)..."
              for _i in $(seq 1 40); do
                sleep 30
                refresh_ci
                echo "  poll $_i: pending=$CHECKS_PENDING frontend=$FRONTEND rust=$RUST ci=$CI_JOB"
                if [ "$CHECKS_PENDING" -eq 0 ] && { [ "$CI_GREEN" = "true" ] || [ "$CI_FAILED" = "true" ]; }; then
                  break
                fi
                # No checks registered yet — keep waiting a bit, then stop.
                if [ "$CHECKS_PENDING" -eq 0 ] && [ -z "$FRONTEND$RUST$CI_JOB" ] && [ "$_i" -ge 4 ]; then
                  echo "No frontend/rust/ci checks appeared; continuing."
                  break
                fi
              done
            fi
          fi

          ACTION=skip
          # Prefer Reviewer → Implementer: never fix in the same run as the first review request.
          if [ "$AGENT_CRASHED" = "true" ] && [ "$CRASH_RETRIES" -lt "$MAX_CRASH_RETRIES" ] \
            && { [ "$CI_FAILED" = "true" ] || [ "$REVIEW_FINDINGS" = "true" ]; }; then
            ACTION=fix_retry
          elif [ "$FIX_ROUNDS" -ge 2 ] && { [ "$CI_FAILED" = "true" ] || [ "$REVIEW_FINDINGS" = "true" ]; }; then
            ACTION=handoff_stuck
          elif [ "$NEED_FIRST_REVIEW" = "true" ]; then
            ACTION=request_review
          elif [ "$ALREADY_FIX_THIS_SHA" = "true" ]; then
            # Waiting for Copilot to push; next synchronize will wait for CI then re-evaluate.
            ACTION=skip
          elif [ "$FIX_ROUNDS" -lt 2 ] && { [ "$CI_FAILED" = "true" ] || [ "$REVIEW_FINDINGS" = "true" ]; }; then
            if [ "$CI_FAILED" = "true" ] && [ "$REVIEW_FINDINGS" = "true" ]; then
              ACTION=fix_both
            elif [ "$CI_FAILED" = "true" ]; then
              ACTION=fix_ci
            else
              ACTION=fix_review
            fi
          elif [ "$CI_GREEN" = "true" ] && [ "$REVIEW_FINDINGS" != "true" ] && [ "$COPILOT_REVIEW_COUNT" -gt 0 ]; then
            ACTION=handoff_ready
          elif [ "$CI_GREEN" = "true" ] && [ "$REVIEW_FINDINGS" != "true" ] && [ "$REVIEW_REQUESTED" -gt 0 ] \
            && [ "$COPILOT_REVIEW_COUNT" -gt 0 ] && [ "$FIX_ROUNDS" -gt 0 ]; then
            ACTION=rerequest_review
          fi

          # Persist findings summary for the implementer step (multiline via delimiter).
          {
            echo "action=$ACTION"
            echo "ci_failed=$CI_FAILED"
            echo "review_findings=$REVIEW_FINDINGS"
            echo "findings_summary<<EOF"
            printf '%s\n' "$FINDINGS_SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR action=$ACTION fix_rounds=$FIX_ROUNDS crash_retries=$CRASH_RETRIES agent_crashed=$AGENT_CRASHED ci_failed=$CI_FAILED ci_green=$CI_GREEN findings=$REVIEW_FINDINGS unresolved=$UNRESOLVED event=$EVENT_NAME wr=${WR_NAME:-}"

      - name: Request Copilot review
        if: steps.decide.outputs.action == 'request_review' || steps.decide.outputs.action == 'rerequest_review'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COMMENT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.decide.outputs.pr }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ACTION: ${{ steps.decide.outputs.action }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${COPILOT_GITHUB_TOKEN:-$COMMENT_TOKEN}"

          PR_NODE=$(gh api graphql -f query="
            query(\$o:String!,\$n:String!,\$p:Int!) {
              repository(owner:\$o,name:\$n) { pullRequest(number:\$p) { id } }
            }" -f o="$OWNER" -f n="$REPO" -F p="$PR" --jq .data.repository.pullRequest.id)

          BOT_NODE=$(gh api users/copilot-pull-request-reviewer%5Bbot%5D --jq .node_id)

          jq -n \
            --arg pr "$PR_NODE" \
            --arg bot "$BOT_NODE" \
            '{
              query: "mutation($pullRequestId: ID!, $botIds: [ID!]!) { requestReviews(input: { pullRequestId: $pullRequestId, botIds: $botIds, union: true }) { pullRequest { id } } }",
              variables: { pullRequestId: $pr, botIds: [$bot] }
            }' > /tmp/request-review.json

          set +e
          gh api graphql --input /tmp/request-review.json
          gstatus=$?
          set -e

          if [ "$gstatus" -ne 0 ]; then
            gh api --method POST "repos/$OWNER/$REPO/pulls/$PR/requested_reviewers" \
              -f 'reviewers[]=copilot-pull-request-reviewer[bot]' || \
            gh api --method POST "repos/$OWNER/$REPO/pulls/$PR/requested_reviewers" \
              -f 'reviewers[]=Copilot' || true
          fi

          export GH_TOKEN="$COMMENT_TOKEN"
          if [ "$ACTION" = "request_review" ]; then
            gh pr comment "$PR" --repo "$OWNER/$REPO" --body "$(printf '%s\n' \
              '<!-- agent-pipeline-review-requested -->' \
              '' \
              'Agent pipeline: requested **Copilot code review**.' \
              'After review (and/or CI), orchestrator will `@copilot` (as the pipeline PAT user) for ≤2 fix rounds, then assign the maintainer.')"
          else
            gh pr comment "$PR" --repo "$OWNER/$REPO" --body "Agent pipeline: re-requested Copilot review after fix round."
          fi

      - name: Ask Copilot to fix (implementer)
        if: >-
          steps.decide.outputs.action == 'fix_ci' ||
          steps.decide.outputs.action == 'fix_review' ||
          steps.decide.outputs.action == 'fix_both' ||
          steps.decide.outputs.action == 'fix_retry'
        env:
          # MUST be a user PAT — github-actions @copilot comments do not start the coding agent.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COMMENT_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.decide.outputs.pr }}
          HEAD_SHA: ${{ steps.decide.outputs.head_sha }}
          FIX_ROUNDS: ${{ steps.decide.outputs.fix_rounds }}
          ACTION: ${{ steps.decide.outputs.action }}
          FINDINGS_SUMMARY: ${{ steps.decide.outputs.findings_summary }}
          CI_FAILED: ${{ steps.decide.outputs.ci_failed }}
          AGENT_RUN_ID: ${{ steps.decide.outputs.agent_run_id }}
          AGENT_RUN_URL: ${{ steps.decide.outputs.agent_run_url }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "COPILOT_GITHUB_TOKEN is required so @copilot is posted by a user (not github-actions)."
            exit 1
          fi
          export GH_TOKEN="$COPILOT_GITHUB_TOKEN"

          NEXT=$((FIX_ROUNDS + 1))
          MARKER="<!-- agent-pipeline-fix-round:${NEXT} sha:${HEAD_SHA} invoked:user -->"
          HEADING="@copilot Fix round **${NEXT}/2** for the agent pipeline."
          case "$ACTION" in
            fix_review)
              REASON="the remaining open Copilot code-review threads listed below. Address each actionable finding; do not expand scope."
              ;;
            fix_both)
              REASON="(1) failing CI checks and (2) the open Copilot code-review threads listed below. Fix both; do not expand scope."
              ;;
            fix_retry)
              MARKER="<!-- agent-pipeline-fix-round:${NEXT} sha:${HEAD_SHA} invoked:user kind:crash-retry crash-run:${AGENT_RUN_ID} -->"
              HEADING="@copilot Fix round **${NEXT}/2** — **retry** after the previous session ended in error."
              REASON="the unfinished work from the aborted session: any leftover partial edits (unused imports, half-done refactors), failing CI, and the open review threads listed below."
              ;;
            *)
              REASON="failing CI checks (lint/typecheck/tests). Reproduce with the repo CI scripts and fix only what is broken."
              ;;
          esac

          BODY=$(printf '%s\n' \
            "$MARKER" \
            "" \
            "$HEADING" \
            "" \
            "Please address: ${REASON}" \
            "")
          if [ "$ACTION" = "fix_retry" ] && [ -n "${AGENT_RUN_URL:-}" ]; then
            BODY=$(printf '%s\n%s\n\n' "$BODY" "Previous session: ${AGENT_RUN_URL}")
          fi
          if [ -n "${FINDINGS_SUMMARY:-}" ]; then
            BODY=$(printf '%s\n%s\n' "$BODY" "$FINDINGS_SUMMARY")
            BODY=$(printf '%s\n' "$BODY" "")
          fi
          BODY=$(printf '%s\n' "$BODY" \
            "- Push commits to **this** PR branch (do not open a separate PR)." \
            "- Do not merge or expand scope beyond the linked Agent plan." \
            "- Before pushing, run \`cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings\`, \`cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check\`, \`npm run lint\` and \`npm run typecheck\`." \
            "- When done, leave CI green and resolve the review threads you addressed.")

          gh pr comment "$PR" --repo "$OWNER/$REPO" --body "$BODY"

          # Extra nudge: assign coding agent on the PR issue with the same instructions.
          jq -n \
            --arg instructions "$BODY" \
            --arg repo "$OWNER/$REPO" \
            --arg base "$(gh pr view "$PR" --repo "$OWNER/$REPO" --json baseRefName --jq .baseRefName)" \
            '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repo,
                base_branch: $base,
                custom_instructions: $instructions,
                custom_agent: "",
                model: ""
              }
            }' > /tmp/fix-assign.json

          set +e
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$OWNER/$REPO/issues/$PR/assignees" \
            --input /tmp/fix-assign.json > /tmp/fix-assign-out.json 2>/tmp/fix-assign-err.txt
          aset=$?
          set -e
          if [ "$aset" -ne 0 ]; then
            echo "Assign nudge failed (comment @copilot may still work):"
            tail -c 2000 /tmp/fix-assign-err.txt || true
          fi

      - name: Handoff to maintainer
        if: steps.decide.outputs.action == 'handoff_ready' || steps.decide.outputs.action == 'handoff_stuck'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.decide.outputs.pr }}
          MAINTAINER: ${{ steps.decide.outputs.maintainer }}
          ACTION: ${{ steps.decide.outputs.action }}
          FIX_ROUNDS: ${{ steps.decide.outputs.fix_rounds }}
          CRASH_RETRIES: ${{ steps.decide.outputs.crash_retries }}
          AGENT_CRASHED: ${{ steps.decide.outputs.agent_crashed }}
          AGENT_RUN_URL: ${{ steps.decide.outputs.agent_run_url }}
          CI_FAILED: ${{ steps.decide.outputs.ci_failed }}
          FINDINGS_SUMMARY: ${{ steps.decide.outputs.findings_summary }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ -n "${MAINTAINER:-}" ]; then
            gh api --method POST "repos/$OWNER/$REPO/issues/$PR/assignees" \
              -f "assignees[]=$MAINTAINER" || true
          fi

          if [ "$ACTION" = "handoff_stuck" ]; then
            MSG=$(printf '%s\n' \
              "<!-- agent-pipeline-handoff -->" \
              "" \
              "Agent pipeline **stopped** after **${FIX_ROUNDS}** fix rounds (cap = 2, crash retries used: ${CRASH_RETRIES:-0})." \
              "" \
              "State at handoff:" \
              "- CI failing: \`${CI_FAILED:-unknown}\`" \
              "- Last Copilot cloud agent session ended in error: \`${AGENT_CRASHED:-false}\`")
            if [ -n "${AGENT_RUN_URL:-}" ]; then
              MSG=$(printf '%s\n' "$MSG" "- Session log: ${AGENT_RUN_URL}")
            fi
            if [ -n "${FINDINGS_SUMMARY:-}" ]; then
              MSG=$(printf '%s\n\n%s' "$MSG" "$FINDINGS_SUMMARY")
            fi
            MSG=$(printf '%s\n\n%s' "$MSG" "Assigned to \`${MAINTAINER:-maintainer}\` for human take-over.")
          else
            MSG=$(printf '%s\n' \
              "<!-- agent-pipeline-handoff -->" \
              "" \
              "Agent pipeline **ready for human approval**: CI green and no open Copilot review threads (or review completed)." \
              "Assigned to \`${MAINTAINER:-maintainer}\`. Please do the final review/merge.")
          fi
          gh pr comment "$PR" --repo "$OWNER/$REPO" --body "$MSG"
