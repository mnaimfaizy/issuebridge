# Official Windows NSIS release build (v0.1).
# Bakes public client id + OAuth exchange URL at compile time; never the client secret.
#
# Repository secrets / vars (Settings -> Secrets and variables -> Actions):
#   ISSUEBRIDGE_GITHUB_CLIENT_ID
#   ISSUEBRIDGE_OAUTH_EXCHANGE_URL  (HTTPS URL of the exchange Worker or cPanel PHP)

name: Release Windows NSIS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install frontend deps
        run: npm ci

      - name: Packaging contract
        run: npm run test:packaging

      - name: Official NSIS release build
        env:
          ISSUEBRIDGE_GITHUB_CLIENT_ID: ${{ secrets.ISSUEBRIDGE_GITHUB_CLIENT_ID }}
          ISSUEBRIDGE_OAUTH_EXCHANGE_URL: ${{ secrets.ISSUEBRIDGE_OAUTH_EXCHANGE_URL }}
        run: powershell -ExecutionPolicy Bypass -File scripts/release-build.ps1

      - name: Upload setup.exe (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: issuebridge-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # Attach installer to the GitHub Release for tag pushes so users get a
      # stable /releases/download/.../*.exe URL (Actions artifacts are not that).
      - name: Attach setup.exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: true
          # Tags with a SemVer pre-release suffix (e.g. v0.1.0-rc.1) are prereleases.
          # Omit body/name so an existing Release (from the release skill) keeps its notes.
          prerelease: ${{ contains(github.ref_name, '-') }}
