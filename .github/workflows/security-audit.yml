# Security audit — weekly / manual / PR (Issuebridge pilot)
# Skill: .agents/skills/security-audit/
# Reports via draft GitHub Security Advisory (private). Never open a public issue with finding detail.
#
# Secrets: COPILOT_GITHUB_TOKEN must include Repository security advisories: write
#          (fine-grained) and the token owner must be admin/security manager.
# Vars:    SECURITY_AUDIT_ENABLED=true
#          SECURITY_AUDIT_ALLOWLIST=mnaimfaizy (comma logins; used for label / dispatch actors)
#          SECURITY_AUDIT_MODEL (optional Copilot CLI --model; e.g. gpt-5.6-sol)
#          SECURITY_AUDIT_REASONING_EFFORT (optional --reasoning-effort; low|medium|high|xhigh)
#          SECURITY_AUDIT_NOTIFY_EMAIL (optional; destination for private email delivery)
#          SECURITY_AUDIT_EMAIL_FROM (optional; verified Resend From address)
# Secrets: RESEND_API_KEY (optional; enables email delivery of report + transcript)

name: Security audit

on:
  schedule:
    # Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: security-audit
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  copilot-requests: write

jobs:
  audit:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'agent:security-audit')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gate
        id: gate
        env:
          ENABLED: ${{ vars.SECURITY_AUDIT_ENABLED }}
          ALLOWLIST: ${{ vars.SECURITY_AUDIT_ALLOWLIST }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || 0 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MODE=full
          if [ "$EVENT" = "pull_request" ]; then
            MODE=pr
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          if [ "${ENABLED:-}" != "true" ]; then
            echo "SECURITY_AUDIT_ENABLED!=true — no-op."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled runs are unattended; label/dispatch require allowlist.
          if [ "$EVENT" != "schedule" ]; then
            IFS=',' read -r -a allowed <<< "${ALLOWLIST:-}"
            ok=false
            for u in "${allowed[@]}"; do
              u_trim="$(echo "$u" | xargs)"
              if [ -n "$u_trim" ] && [ "$u_trim" = "$ACTOR" ]; then
                ok=true
                break
              fi
            done
            if [ "$ok" != "true" ]; then
              echo "Actor $ACTOR not on SECURITY_AUDIT_ALLOWLIST — no-op."
              if [ "$EVENT" = "pull_request" ] && [ "${PR:-0}" != "0" ]; then
                gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
                  --body "Security audit ignored: \`$ACTOR\` is not on \`SECURITY_AUDIT_ALLOWLIST\`."
              fi
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "$EVENT" = "pull_request" ] && [ "${PR:-0}" != "0" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "agent:security-audit" || true
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version: "22"

      - name: Install Copilot CLI + jq helpers
        if: steps.gate.outputs.proceed == 'true'
        run: npm install -g @github/copilot

      - name: Run security audit (Copilot CLI)
        if: steps.gate.outputs.proceed == 'true'
        id: scan
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.gate.outputs.mode }}
          BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
          AUDIT_MODEL: ${{ vars.SECURITY_AUDIT_MODEL }}
          AUDIT_EFFORT: ${{ vars.SECURITY_AUDIT_REASONING_EFFORT }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            export COPILOT_GITHUB_TOKEN="$GH_TOKEN"
          fi

          # Unavailable model/effort values may warn and fall back — log what we requested.
          MODEL_ARGS=()
          if [ -n "${AUDIT_MODEL:-}" ]; then
            MODEL_ARGS+=(--model "$AUDIT_MODEL")
            echo "Requested model: $AUDIT_MODEL"
          else
            echo "No SECURITY_AUDIT_MODEL set — using Copilot CLI default."
          fi
          if [ -n "${AUDIT_EFFORT:-}" ]; then
            MODEL_ARGS+=(--reasoning-effort "$AUDIT_EFFORT")
            echo "Requested reasoning effort: $AUDIT_EFFORT"
          else
            echo "No SECURITY_AUDIT_REASONING_EFFORT set — using model default."
          fi

          # Write inside the workspace — Copilot CLI write tools often cannot create /tmp paths.
          REPORT="$GITHUB_WORKSPACE/security-audit-report.md"
          SESSION="$GITHUB_WORKSPACE/security-audit-session.md"
          CLI_LOG="$GITHUB_WORKSPACE/security-audit-cli.log"
          : > "$REPORT"

          {
            echo "Mode: $MODE"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Working directory: $GITHUB_WORKSPACE"
            echo "Report file (write your FULL markdown report ONLY to this exact path): $REPORT"
            echo "Do not write the report only to stdout — the file must contain the complete ## Security audit report."
            echo
            if [ "$MODE" = "pr" ] && [ -n "${BASE_REF:-}" ]; then
              echo "PR diff base: $BASE_REF"
              echo "Changed files:"
              git diff --name-only "$BASE_REF"...HEAD || true
              echo
              echo "Diff (truncated):"
              git diff --unified=3 "$BASE_REF"...HEAD | head -c 200000 || true
              echo
            fi
            echo "-----"
            echo
            cat .github/security-audit/prompt.md
            echo
            echo "-----"
            echo
            echo "Threat model (inline for CI reliability):"
            echo
            cat .agents/skills/security-audit/threat-model.md
            echo
            echo "-----"
            echo
            echo "Report format (inline):"
            echo
            cat .agents/skills/security-audit/report-format.md
          } > "$GITHUB_WORKSPACE/security-audit-user.txt"

          set +e
          copilot -p "$(cat "$GITHUB_WORKSPACE/security-audit-user.txt")" \
            -s \
            --no-ask-user \
            --add-dir="$GITHUB_WORKSPACE" \
            --share="$SESSION" \
            "${MODEL_ARGS[@]}" \
            --allow-tool='shell(ls:*),shell(find:*),shell(cat:*),shell(head:*),shell(rg:*),shell(grep:*),shell(git:*),shell(cargo:*),shell(npm:*)' \
            --allow-tool=write \
            --allow-tool=read \
            >"$CLI_LOG" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Copilot CLI failed (exit $code). Log (tail):"
            tail -n 200 "$CLI_LOG" || true
            exit "$code"
          fi

          if [ ! -s "$REPORT" ]; then
            # Some CLI builds write only to stdout — capture fallback.
            if grep -q '## Security audit report' "$CLI_LOG"; then
              awk '/^## Security audit report/{flag=1} flag{print}' "$CLI_LOG" > "$REPORT"
            fi
          fi

          if [ ! -s "$REPORT" ]; then
            echo "Empty report — failing."
            tail -n 200 "$CLI_LOG" || true
            exit 1
          fi

          echo "Report bytes: $(wc -c < "$REPORT" | tr -d '[:space:]')"
          echo "CLI log bytes: $(wc -c < "$CLI_LOG" | tr -d '[:space:]')"
          if [ -f "$SESSION" ]; then
            echo "Session transcript bytes: $(wc -c < "$SESSION" | tr -d '[:space:]')"
          else
            echo "Session transcript: missing (Copilot --share may be unsupported on this CLI version)."
          fi
          # Safe metadata only — never dump finding bodies or transcripts to public Actions logs.
          grep -E '^\- \*\*(Mode|Scope|Date|Max severity|Finding count):\*\*' "$REPORT" || true
          FCOUNT="$(grep -cE '^### F[0-9]+ [—-]' "$REPORT" || true)"
          echo "F-heading count: $(printf '%s' "$FCOUNT" | tr -d '[:space:]')"
          echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"
          echo "cli_log_path=$CLI_LOG" >> "$GITHUB_OUTPUT"
          echo "session_path=$SESSION" >> "$GITHUB_OUTPUT"

      # Do NOT upload-artifact on a public repo — artifacts are world-readable.
      # Do NOT print secret-gist URLs — they would leak via public Actions logs.
      - name: Use trusted publisher script from default branch
        if: >-
          steps.gate.outputs.proceed == 'true' &&
          github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Avoid executing a PR-modified publisher with the privileged PAT (F3 class).
          git fetch --no-tags origin "$BASE_SHA"
          git checkout "$BASE_SHA" -- \
            .github/security-audit/publish-draft-advisory.sh \
            .github/security-audit/notify-email.sh
          echo "Publisher + email notifier restored from PR base $BASE_SHA"

      - name: Publish draft Security Advisory (private, always)
        if: steps.gate.outputs.proceed == 'true'
        id: publish
        env:
          # Must be able to create draft advisories (admin/security manager + advisories:write).
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SECURITY_AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SECURITY_AUDIT_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "COPILOT_GITHUB_TOKEN missing — cannot create private draft advisory."
            exit 1
          fi
          chmod +x .github/security-audit/publish-draft-advisory.sh
          .github/security-audit/publish-draft-advisory.sh \
            "$GITHUB_WORKSPACE/security-audit-report.md" \
            "$GITHUB_WORKSPACE/security-audit-cli.log" \
            "$GITHUB_WORKSPACE/security-audit-session.md"

      - name: Email report + transcript (optional)
        if: steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        env:
          SECURITY_AUDIT_NOTIFY_EMAIL: ${{ vars.SECURITY_AUDIT_NOTIFY_EMAIL }}
          SECURITY_AUDIT_EMAIL_FROM: ${{ vars.SECURITY_AUDIT_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECURITY_AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GHSA_ID: ${{ steps.publish.outputs.ghsa_id }}
        run: |
          set -euo pipefail
          chmod +x .github/security-audit/notify-email.sh
          .github/security-audit/notify-email.sh \
            "$GITHUB_WORKSPACE/security-audit-report.md" \
            "$GITHUB_WORKSPACE/security-audit-cli.log" \
            "$GITHUB_WORKSPACE/security-audit-session.md" \
            "${GHSA_ID:-}"

      - name: PR status comment (counts only)
        if: >-
          steps.gate.outputs.proceed == 'true' &&
          github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          COUNT: ${{ steps.publish.outputs.finding_count }}
          MAX: ${{ steps.publish.outputs.max_severity }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          set -euo pipefail
          if [ "${COUNT:-0}" = "0" ] || [ -z "${COUNT:-}" ]; then
            BODY="Security audit (PR mode): no Medium+ findings. A private draft advisory with the full report/transcript was filed for maintainers (Security → Advisories)."
          else
            BODY="Security audit (PR mode): **${COUNT}** Medium+ finding(s) (max **${MAX}**) filed as a **draft** Security Advisory for maintainers — details are not posted publicly."
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
